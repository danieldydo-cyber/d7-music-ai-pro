<script>
(function(){
var $=function(i){return document.getElementById(i)};
/* self-repair: show errors, count them */
var ERR=0;window.addEventListener('error',function(e){ERR++;$('err').textContent='⚠ błąd JS naprawiony/zignorowany: '+(e.message||'').slice(0,80)});
window.addEventListener('unhandledrejection',function(e){ERR++;$('err').textContent='⚠ '+String(e.reason).slice(0,80)});
function jfetch(u,o,ms,tries){tries=tries==null?2:tries;var c=new AbortController(),t=setTimeout(function(){c.abort()},ms||15000);o=o||{};o.signal=c.signal;
 return fetch(u,o).then(function(r){clearTimeout(t);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).catch(function(e){clearTimeout(t);if(tries>0)return new Promise(function(res){setTimeout(res,800)}).then(function(){return jfetch(u,o,ms,tries-1)});throw e})}
document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){document.querySelectorAll('section').forEach(function(s){s.classList.toggle('on',s.id==b.dataset.s)})}});
/* health indicator */
function health(){var eps=['api/status','api/bot-mesh','api/bots'],ok=0;Promise.all(eps.map(function(e){return jfetch(e,{},6000,0).then(function(){ok++},function(){})})).then(function(){
 $('hd').style.background=ok==eps.length?'#2e2':ok?'#fa0':'#e22';$('ht').textContent='API '+ok+'/'+eps.length+(navigator.onLine?'':' · offline')+(ERR?' · błędy JS: '+ERR:'')})}
health();setInterval(health,30000);
/* auto-reload when the page is broken (>=5 JS errors), at most once per 10 min */
setInterval(function(){if(ERR>=5){var l=+sessionStorage.getItem('g.rl')||0;if(Date.now()-l>600000){sessionStorage.setItem('g.rl',Date.now());location.reload()}}},10000);
/* avatar: mouth + blink */
var talking=0;(function anim(){requestAnimationFrame(anim);var m=$('mouth');m.setAttribute('ry',talking?4+Math.abs(Math.sin(performance.now()/70))*16:4)})();
setInterval(function(){['eL','eR'].forEach(function(i){$(i).setAttribute('ry',1);setTimeout(function(){$(i).setAttribute('ry',14)},150)})},4000);
function speak(t){if(!$('tts').checked||!window.speechSynthesis){talking=1;setTimeout(function(){talking=0},1500);return}
 try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t.replace(/\[[^\]]*\]/g,'').slice(0,400));u.lang='pl-PL';u.pitch=.6;u.onstart=function(){talking=1};u.onend=u.onerror=function(){talking=0};speechSynthesis.speak(u);setTimeout(function(){if(!speechSynthesis.speaking)talking=0},20000)}catch(e){talking=0}}
function out(c,t){var d=document.createElement('div');d.className=c;d.textContent=t;$('log').appendChild(d);$('log').scrollTop=1e9}
/* offline knowledge + web fallback */
var OFF=[[/bpm|tempo/,'BPM to uderzenia na minutę: house ~120–128, techno ~125–140, hip-hop ~80–100.'],[/radio/,'Radio jest w Multitool → „Radio + Generator”.'],[/mc.?707|roland/,'Roland MC-707 to groovebox z 8 ścieżkami, samplerem i efektami; D7 DJ jest jego aplikacją-towarzyszem.'],[/(czesc|cześć|hej|siema)/,'Siema Daniel! 😈 Tu Super Bot G — pytaj, odpowiem głosem całego zespołu botów.']];
function offline(q){var t=q.toLowerCase();for(var i=0;i<OFF.length;i++)if(OFF[i][0].test(t))return OFF[i][1];return null}
function web(q){var t=q.replace(/[?!.]+$/,'');return jfetch('https://pl.wikipedia.org/w/api.php?action=query&list=search&format=json&origin=*&srlimit=1&srsearch='+encodeURIComponent(t),{},7000,0).then(function(j){var h=j.query.search[0];if(!h)throw 0;return jfetch('https://pl.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(h.title.replace(/ /g,'_')),{},7000,0)}).then(function(p){if(!p.extract)throw 0;return p.extract.slice(0,500)+' [Wikipedia]'})
 .catch(function(){return jfetch('https://api.duckduckgo.com/?format=json&no_html=1&q='+encodeURIComponent(t),{},7000,0).then(function(d){if(!d.AbstractText)throw 0;return d.AbstractText.slice(0,500)+' [DuckDuckGo]'})})}
/* merge all bots (server brain /api/chat bot=all) */
var ACK=/^\s*(\[[^\]]*\]\s*)?(odbieram|ok|okej|received|roger|ack)[\s.!…]*$/i,LOCAL=/Tryb lokalny|chwilowo niedostępne/;
function strip(a){return String(a||'').replace(/^\s*(\[[^\]]{1,40}\]\s*)+/,'').trim()}
var LAST={};
function merge(replies){var seen={},u=[];replies.forEach(function(r){var t=strip(r.answer);if(!t||ACK.test(r.answer)||LOCAL.test(t)||t.length<12)return;var k=t.toLowerCase().slice(0,60);if(seen[k]){seen[k].by.push(r.bot);return}seen[k]={t:t,by:[r.bot],src:r.source};u.push(seen[k])});
 u.sort(function(a,b){return b.by.length-a.by.length||b.t.length-a.t.length});return u}
function ask(q){out('u','Ty: '+q);out('b','😈 G: pytam wszystkie boty…');
 var mesh=jfetch('api/bot-mesh',{},6000,1).then(function(j){return j.peers||[]},function(){return[]});
 var all=jfetch('api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q:q,bot:'all',lang:'pl'})},90000,0).then(function(j){return j.replies||[]})
  .catch(function(){return jfetch('api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q:q,bot:'megabot',lang:'pl'})},40000,1).then(function(j){return[j]},function(){return[]})});
 return Promise.all([mesh,all]).then(function(r){var peers=r[0],reps=r[1];reps.forEach(function(x){LAST[x.bot]=strip(x.answer)});rooms(peers);
  var u=merge(reps),txt;
  if(u.length){txt=u[0].t+'\n— zgoda: '+u[0].by.join(', ')+' ('+(u[0].src||'?')+') · boty: '+reps.length+' · mesh: '+peers.length+' peerów'+(u[1]?'\n➕ '+u[1].by.join(', ')+': '+u[1].t.slice(0,250):'');return txt}
  var o=offline(q);if(o)return o+' [offline]';return web(q).catch(function(){return 'Nie wiem tego na pewno — boty i wyszukiwarka nie dały odpowiedzi. Spróbuj inaczej sformułować.'})})
 .then(function(t){out('b','😈 G: '+t);speak(t);log(q,t)},function(e){var o=offline(q)||'Błąd połączenia — działam offline.';out('b','😈 G: '+o);speak(o)})}
function log(q,t){jfetch('api/chat-log',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:'super-bot-g',text:'Q: '+q+'\nA: '+t.slice(0,1500),tags:['learn','help']})},8000,0)
 .then(function(){$('slog').textContent='zapisano we wspólnym logu ✅'},function(){$('slog').textContent='wspólny log wymaga tokenu właściciela (d7.tok) — zapis lokalny';try{var L=JSON.parse(localStorage.getItem('g.log')||'[]');L.push({q:q,t:t,at:Date.now()});localStorage.setItem('g.log',JSON.stringify(L.slice(-100)))}catch(e){}})}
function rooms(peers){jfetch('api/bots',{},6000,1).then(function(j){var bs=j.bots||[];$('rooms').innerHTML='';bs.forEach(function(b){var d=document.createElement('div');d.className='room';d.innerHTML='<b></b><br><i></i><p></p>';d.querySelector('b').textContent='🚪 '+b.name;d.querySelector('i').textContent=b.role||'';d.querySelector('p').textContent=(LAST[b.name]||'—').slice(0,160);$('rooms').appendChild(d)});
 peers.slice(0,30).forEach(function(p){var d=document.createElement('div');d.className='room';d.textContent='🌐 '+(p.name||p.id)+' · '+(p.status||'?')+' (mesh)';$('rooms').appendChild(d)})},function(){$('rooms').textContent='Nie mogę pobrać listy botów (API offline).'})}
rooms([]);jfetch('api/bot-mesh',{},6000,1).then(function(j){rooms(j.peers||[])},function(){});
jfetch('sync-manifest.json',{},8000,1).then(function(m){$('mst').textContent='liveUrl: '+m.liveUrl+' · APK: '+(m.apkUrl||'?')},function(){$('mst').textContent='manifest niedostępny'});
$('go').onclick=function(){var q=$('q').value.trim();if(q){$('q').value='';ask(q)}};$('q').onkeydown=function(e){if(e.key=='Enter')$('go').onclick()};
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('mic').disabled=true;$('mic').title='Rozpoznawanie mowy nieobsługiwane w tej przeglądarce'}
else $('mic').onclick=function(){try{var r=new SR();r.lang='pl-PL';r.onresult=function(e){var t=e.results[0][0].transcript;ask(t)};r.onerror=function(e){$('err').textContent='🎤 '+e.error};r.start();$('mic').textContent='🔴'; r.onend=function(){$('mic').textContent='🎤'}}catch(e){$('err').textContent='🎤 '+e.message}};
out('b','😈 Siema! Jestem Super Bot G — łączę wszystkie boty D7. Pisz albo mów 🎤.');
