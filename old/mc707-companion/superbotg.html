<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Super Bot G · D7 DJ 2077</title>
<style>
html,body{margin:0;height:100%;background:#05010a;color:#fff;font:15px system-ui,sans-serif;overflow:hidden}
#viz{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#ui{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;pointer-events:none}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#0008;pointer-events:auto}
header b{font:900 20px system-ui;background:linear-gradient(90deg,#ff2bd6,#ffd23f,#00f0ff);-webkit-background-clip:text;color:transparent;letter-spacing:1px}

#stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
#devil{width:min(78vw,380px);height:auto;filter:drop-shadow(0 0 18px #ff2bd6aa)}
#log{max-height:26vh;overflow:auto;margin:0 10px;padding:6px 10px;background:#000a;border-radius:10px;pointer-events:auto;font-size:14px}
#log .g{color:#ffd23f}#log .u{color:#8ff}
#bar{display:flex;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));pointer-events:auto;flex-wrap:wrap}
#bar input{flex:1 1 160px;padding:10px;border-radius:10px;border:1px solid #ff2bd6;background:#111c;color:#fff;font-size:15px}
#bar button,#bar select{padding:9px 11px;border:0;border-radius:10px;background:#2a0c3a;color:#fff;font-weight:700}
#bar .hot{background:linear-gradient(90deg,#ff2bd6,#ff7a00)}
#src{max-width:150px}
</style></head><body>

</div>
