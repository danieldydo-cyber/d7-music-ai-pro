:root{--bg:#05060c;--panel:#0e1020;--line:#2a2d4a;--txt:#e9e6ff;--acc:#00e5ff;--acc2:#b84dff;--ok:#8dff6a;--bad:#ff4d6d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px system-ui,sans-serif}
header{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:18px;margin:0;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;color:transparent}
nav{display:flex;gap:6px;flex-wrap:wrap}nav button,.btn{background:#171a33;color:var(--txt);border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer;font:600 13px system-ui}
nav button.on,.btn.pri{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#05060c;border:0}
section{display:none;padding:12px 14px}section.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
#viz{width:100%;height:56vh;display:block;border-radius:14px;background:#000}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input,select,textarea{background:#090b18;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px}
#stations{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;max-height:52vh;overflow:auto}
.st{background:#12152a;border:1px solid var(--line);border-radius:10px;padding:8px;cursor:pointer}.st:hover{border-color:var(--acc)}.st small{opacity:.7;display:block}
#log{height:46vh;overflow:auto;display:flex;flex-direction:column;gap:6px}.m{padding:8px 11px;border-radius:12px;max-width:85%;white-space:pre-wrap}.m.me{align-self:flex-end;background:#1d2b55}.m.bot{background:#1a1230}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--bad)}.dot.ok{background:var(--ok)}
table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid var(--line);padding:6px;text-align:left;font-size:13px}
#np{font-weight:700;color:var(--acc)}
</style></head><body>
